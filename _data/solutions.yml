# Solutions directory (/solutions/). Cards are sorted alphabetically by `solution`.
#
# Fields:
#   solution:     solution name, shown as the card title (required)
#   company:      company or project owner, shown under the title (required)
#   logo:         /images/solutions/logo_<companyname>.(png|svg)  (optional)
#   image:        /images/solutions/card_<solutionname>.png, shown 100px high (optional)
#   description:  card text (required)
#   link:         "More information" URL (optional)
#   type:         open-source | commercial | professional-services | free-tool
#   functions:    list of function tags used by the filter

- solution: tx darwin
  company: Techex
  logo: /images/solutions/logo_techex.png
  image: /images/solutions/card_txdarwin.png
  description: >
    tx darwin provides comprehensive manipulation and syncrhonisation of transport streams ahead of writing to a TAMS store. tx darwin is a software platform which runs in the cloud or on-prem supporting compressed or uncompressed media workflows. Now, it's possible to synchronise miltiple feeds on writing, write as multiple essences or a single combined stream and even perform video.and audio confromance ahead of a TAMS media store.
  link: https://example.com
  type: commercial
  functions:
    - ingest

- solution: CuttingRoom Web Based Editing
  company: CuttingRoom
  logo: /images/solutions/logo_cuttingroom.png
  image: /images/solutions/card_webbasedediting.png
  description: >
    Edit directly from your TAMS store in the CuttingRoom Cloud Editor. Add growing TAMS recordings even directly to your timeline. Shoot directly to your TAMS store with the mobile news gathering app CuttingRoom Reporter, enabling editing while shooting.
  link: https://www.cuttingroom.com/
  type: commercial
  functions:
    - edit
    - camera

- solution: TAMS Store Browser
  company: CuttingRoom
  logo: /images/solutions/logo_cuttingroom.png
  image: /images/solutions/card_tamsstorebrowser.png
  description: >
     This project is a fork of AWS TAMS Tools, an open-source project by Amazon Web Services
  link: https://github.com/cuttingroom/tamstool
  type: open-source
  functions:
    - browse

- solution: TAMS API Implementation
  company: AWS
  logo: /images/solutions/logo_aws.svg
  image: /images/solutions/card_awstamsapi.png
  description: >
    Implementation of the TAMS API released by AWS, built on serverless AWS services. Designed to help customers and partners start their journey with TAMS. It deploys into your own AWS account with AWS SAM, and each release implements a published version of the TAMS specification.
  link: https://github.com/awslabs/time-addressable-media-store
  type: open-source
  functions:
    - store

- solution: TAMS Tools
  company: AWS
  logo: /images/solutions/logo_aws.svg
  image: /images/solutions/card_awstamstools.png
  description: >
    A collection of tools from AWS to complement the AWS TAMS API implementation. Includes a web UI with an embedded Omakase player, media processing workflows and more. Optional components add HLS playback, HLS and FFmpeg-based ingest, replication between stores and a loop recorder.
  link: https://github.com/aws-samples/time-addressable-media-store-tools
  type: open-source
  functions:
    - browse
    - processing

- solution: TAMOSS
  company: LiveWyer
  description: >
    A Kubernetes-native implementation of the TAMS API, installed and managed by a Kubernetes operator. Ships deployment profiles from a local Kind cluster and single ARM64 edge nodes through to multi-server production clusters, with support for external PostgreSQL, S3-compatible storage and OAuth2/OIDC authentication. Includes a web UI for browsing the store.
  link: https://github.com/livewyer-ops/tamoss/
  type: open-source
  functions:
    - store

- solution: TAMS in FFmpeg
  company: hootworks
  image: /images/solutions/card_ffmpeg.png
  description: >
    A fork of FFmpeg that adds a TAMS demuxer and muxer to libavformat, so FFmpeg can read media from and write media to a TAMS store.
  link: https://github.com/hootworks/FFmpeg/tree/tams
  type: open-source
  functions:
    - ingest
    - export

- solution: TAMS Checker
  company: LiveWyer
  description: >
    A free tool that tests your TAMS implementation's API responses, resource workflows and media transfers against the TAMS 8.2 specification, as well as implementation decisions captured outside the API spec. Each run produces an easy-to-read report, plus JSON and JUnit output for engineering teams and vendors. The checker creates and removes its own test data but leaves some artefacts, as the current specification requires, so run it against a dedicated test instance.
  link: https://check.tams.lwy.sh/
  type: free-tool
  functions:
    - testing

- solution: TAMS in Practice
  company: LiveWyer & Techex
  description: >
    An interactive, guided walk-through tutorial that runs entirely in your browser on TASM, LiveWyer's TAMS implementation compiled to WebAssembly. Aimed at technical staff who are new to TAMS or want to firm up their knowledge, it is a gentle introduction to the TAMS API and media storage principles.
  link: https://demo.tams.lwy.sh/
  type: free-tool
  functions:
    - learning
