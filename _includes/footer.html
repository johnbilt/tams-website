<footer class="site-footer">
  <div class="cols">
    <div>
      <div class="lockup">
        <svg width="42.3" height="21.15" viewBox="0 0 24 12" aria-hidden="true">
          <rect x="0" y="0" width="14" height="5" fill="var(--amber)"></rect>
          <rect x="16" y="0" width="8" height="5" fill="var(--amber)"></rect>
          <rect x="0" y="7" width="6" height="5" fill="currentColor"></rect>
          <rect x="8" y="7" width="16" height="5" fill="currentColor"></rect>
        </svg>
        <div class="wm">TAMS</div>
      </div>
      <div class="tagline">an open specification for time-addressable media</div>
    </div>
    <div class="fcols">
      {%- for col in site.data.footer.columns -%}
      <div>
        <div class="fcol-h">{{ col.heading | upcase }}</div>
        {%- for link in col.links -%}
        <a href="{{ link.url | relative_url }}"{% if link.url contains '//' %} target="_blank" rel="noopener noreferrer"{% endif %}>{{ link.name }}</a>
        {%- endfor -%}
      </div>
      {%- endfor -%}
    </div>
  </div>
</footer>
