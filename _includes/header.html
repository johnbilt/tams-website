<nav class="hero-dark topbar">
  <a class="brand" href="{{ '/' | relative_url }}">
    <img class="hd-lockup" src="{{ '/assets/img/tams-lockup-color-dark.svg' | relative_url }}" alt="TAMS — Time Addressable Media Store">
  </a>
  <div class="hd-nav">
    {%- for item in site.data.navigation.main -%}
      {%- assign cur = false -%}
      {%- if item.url == "/" and page.url == "/" -%}{%- assign cur = true -%}
      {%- elsif item.url != "/" and page.url contains item.url -%}{%- assign cur = true -%}{%- endif -%}
      <a href="{{ item.url | relative_url }}"{% if cur %} class="cur"{% endif %}>{{ item.title }}</a>
    {%- endfor -%}
  </div>
  <a class="btn hd-github" href="{{ site.github_url }}" target="_blank" rel="noopener noreferrer">GitHub &#8599;</a>
</nav>
