---
layout: default
---
{%- include page-hero.html -%}

<div class="page-body">
  <div class="content prose">
    {{ content }}
  </div>

  <div class="radial">
    <div class="radial-hub">
      <span class="radial-hub-icon"><i class="fas {{ page.hub_icon }}"></i></span>
      <span class="radial-hub-title">{{ page.hub_title }}</span>
    </div>
    <div class="radial-spokes">
      {%- for card in page.cards -%}
      <button class="radial-card" type="button" data-card="{{ forloop.index }}">
        <span class="radial-icon"><i class="fas {{ card.icon }}"></i></span>
        <span class="radial-body">
          <span class="radial-title">{{ card.title }}</span>
          <span class="radial-summary">{{ card.summary }}</span>
        </span>
      </button>
      {%- endfor -%}
    </div>

    {%- for card in page.cards -%}
    <div class="ig-detail" id="radial-detail-{{ forloop.index }}" hidden>
      <div class="ig-detail-box">
        <div class="ig-detail-head">
          <h2><span class="ig-icon-sm"><i class="fas {{ card.icon }}"></i></span>{{ card.title }}</h2>
          <button class="ig-close" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="content">
          {{ card.detail | markdownify }}
        </div>
      </div>
    </div>
    {%- endfor -%}
  </div>
</div>

<script>
(function () {
  var cards = document.querySelectorAll('.radial-card');
  var details = document.querySelectorAll('#radial-detail-1, [id^="radial-detail-"]');
  function closeAll() {
    cards.forEach(function (c) { c.classList.remove('is-active'); });
    details.forEach(function (d) { d.hidden = true; });
  }
  cards.forEach(function (card) {
    card.addEventListener('click', function () {
      var id = card.getAttribute('data-card');
      var detail = document.getElementById('radial-detail-' + id);
      var isOpen = !detail.hidden;
      closeAll();
      if (!isOpen) {
        card.classList.add('is-active');
        detail.hidden = false;
        detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });
  });
  document.querySelectorAll('.radial .ig-close').forEach(function (btn) {
    btn.addEventListener('click', function (e) { e.stopPropagation(); closeAll(); });
  });
})();
</script>
