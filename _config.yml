# ─────────────────────────────────────────────────────────────
# TAMS website — Jekyll config
# ─────────────────────────────────────────────────────────────
title: "TAMS"
tagline: "Time Addressable Media Store"
description: >-
  TAMS (Time Addressable Media Store) is an open-source API specification for
  storing media as time-addressable chunks in commodity object storage.
# ── URL / baseurl ──
# LIVE: served at the tams.org apex domain (CNAME file present).
# Requires DNS A records for tams.org pointing at GitHub Pages
# (185.199.108-111.153) and the custom domain set in repo Settings > Pages.
# For local/project-path preview, temporarily set:
#   url: "https://johnbilt.github.io"   baseurl: "/tams-website"
url: "https://tams.org"
baseurl: ""

github_url: "https://github.com/bbc/tams"

# ── Build ──
# Self-contained theme — no gem/remote theme. Explicitly disable the GitHub Pages
# default (jekyll-theme-primer) so it doesn't inject its own layouts/assets
# (its assets/css/style.css was shadowing ours).
theme: null
markdown: kramdown
permalink: /:categories/:year/:month/:day/:title/

# ── Blog pagination (jekyll-paginate) ──
paginate: 11
paginate_path: "/blog/page:num/"

# ── Plugins (all supported by GitHub Pages) ──
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# ── Default front matter ──
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# ── Exclude from build ──
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .sass-cache
  - .jekyll-cache
